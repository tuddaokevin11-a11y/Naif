<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - D-Nif Dance Studio</title>
    <link rel="stylesheet" href="account.css">
</head>

<body>
    <div class="account-box">
        <h1>Create Account</h1>
        <p>Join D-Nif Dance Studio</p>
        <form id="accountForm"><input id="newEmail" placeholder="Enter Email" required><input type="password"
                id="newPassword" placeholder="Create Password" required><input type="password" id="confirmPassword"
                placeholder="Confirm Password" required><button type="submit">CREATE ACCOUNT</button></form>
        <p id="createMessage"></p><a href="login.html">Already have an account? Log In</a>
    </div>
    <script src="js/account.js"></script>
</body>

</html>
